[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hassett-lattice-explorer"
version = "1.1.0"
description = "Exact irreducible components of intersections of Hassett divisors, with certificates"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["algebraic geometry", "cubic fourfolds", "Hassett divisors", "lattices"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.scripts]
hassett-lattices = "hassett_lattices.__main__:main"

[tool.setuptools.packages.find]
include = ["hassett_lattices*"]
