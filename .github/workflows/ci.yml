name: Verify source and release pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Tests, certificates and application behavior
        run: python scripts/validate_release.py
      - name: Independently audit embedded classification
        run: python scripts/audit_classification.py web/catalogue.json --report build/validation/classification-audit.json
      - name: General Hermite audit and mathematical benchmark dossiers
        run: |
          python scripts/audit_hnf.py web/catalogue.json --report build/validation/hnf-audit.json
          python scripts/mathematical_report.py --check
      - name: Build Python distributions and verify installed CLI
        run: |
          python -m pip install build
          python -m build --outdir build/python-package
          python -m pip install build/python-package/*.whl
          cd "${RUNNER_TEMP}"
          hassett-lattices intersect 8 26
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: validation-python-${{ matrix.python }}
          path: build/validation/
          if-no-files-found: warn
