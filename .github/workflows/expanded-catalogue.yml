name: Verify pinned expanded catalogue

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Retrieve pinned release bytes
        run: python scripts/download_catalogue.py --output build/catalogue-500
      - name: Verify every certificate
        run: python scripts/verify_catalogue.py build/catalogue-500/catalogue-index.json --report build/validation/catalogue-verification-500.json
      - name: Test application against expanded data
        run: python scripts/validate_release.py --hosted-data build/catalogue-500
      - name: Package verified data and source
        run: |
          python scripts/package_catalogue.py build/catalogue-500/catalogue-index.json --verification build/validation/catalogue-verification-500.json --output build/deliverables
          python scripts/package_release.py --output build/deliverables --validation-dir build/validation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-catalogue-500
          path: |
            build/validation/
            build/deliverables/
          retention-days: 30
